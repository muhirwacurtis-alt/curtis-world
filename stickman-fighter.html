<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGAME | Stickman Fighter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 20px;
    color: #f5c542;
    font-size: 28px;
    font-weight: bold;
}

.game-box {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

canvas {
    width: 100%;
    background: linear-gradient(#17172b, #080808);
    border: 2px solid #f5c542;
    border-radius: 12px;
}

.controls {
    margin: 20px auto;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    padding: 15px 22px;
    border: 1px solid #f5c542;
    background: #171717;
    color: #f5c542;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #f5c542;
    color: #000;
}

.info {
    color: #aaa;
    margin: 15px;
}

.back {
    display: inline-block;
    color: #f5c542;
    margin: 20px;
    text-decoration: none;
}
</style>
</head>

<body>

<header>🎮 DIGAME — SHADOW ARENA</header>

<div class="game-box">

<canvas id="game" width="900" height="450"></canvas>

<div class="controls">
    <button onclick="move(-1)">⬅ LEFT</button>
    <button onclick="move(1)">RIGHT ➡</button>
    <button onclick="jump()">⬆ JUMP</button>
    <button onclick="attack()">⚡ ACTION</button>
    <button onclick="restart()">🔄 RESTART</button>
</div>

<p class="info">
    Move with A/D or arrows · Jump with W/↑ · Action with J
</p>

<a class="back" href="index.html">← Back to DIGAME</a>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
    x: 180,
    y: 330,
    vx: 0,
    vy: 0,
    health: 100,
    color: "#f5c542",
    attacking: false
};

let opponent = {
    x: 650,
    y: 330,
    health: 100,
    color: "#45b8ff"
};

let keys = {};
let gameOver = false;
let message = "SHADOW ARENA";
let attackTimer = 0;

function drawFighter(f, isPlayer) {
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";

    // Head
    ctx.beginPath();
    ctx.arc(f.x, f.y - 65, 18, 0, Math.PI * 2);
    ctx.stroke();

    // Body
    ctx.beginPath();
    ctx.moveTo(f.x, f.y - 45);
    ctx.lineTo(f.x, f.y);
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(f.x - 20, f.y + 30);
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(f.x + 20, f.y + 30);
    ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(f.x, f.y - 35);
    ctx.lineTo(f.x - 30, f.y - 15);

    if (f.attacking) {
        ctx.moveTo(f.x, f.y - 35);
        ctx.lineTo(f.x + 55, f.y - 35);
    } else {
        ctx.moveTo(f.x, f.y - 35);
        ctx.lineTo(f.x + 30, f.y - 15);
    }

    ctx.stroke();
}

function drawHealth() {
    ctx.fillStyle = "#333";
    ctx.fillRect(40, 30, 350, 22);
    ctx.fillRect(510, 30, 350, 22);

    ctx.fillStyle = "#f5c542";
    ctx.fillRect(40, 30, player.health * 3.5, 22);

    ctx.fillStyle = "#45b8ff";
    ctx.fillRect(510, 30, opponent.health * 3.5, 22);

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("PLAYER", 40, 22);
    ctx.fillText("OPPONENT", 510, 22);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Arena floor
    ctx.fillStyle = "#252525";
    ctx.fillRect(0, 370, 900, 80);

    // Arena line
    ctx.strokeStyle = "#f5c542";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 370);
    ctx.lineTo(900, 370);
    ctx.stroke();

    drawHealth();
    drawFighter(player, true);
    drawFighter(opponent, false);

    ctx.fillStyle = "#f5c542";
    ctx.font = "bold 25px Arial";
    ctx.textAlign = "center";
    ctx.fillText(message, 450, 100);
    ctx.textAlign = "left";

    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "bold 40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("ROUND FINISHED", 450, 220);
        ctx.textAlign = "left";
    }
}

function move(dir) {
    if (!gameOver) {
        player.x += dir * 25;
        player.x = Math.max(40, Math.min(860, player.x));
    }
}

function jump() {
    if (!gameOver && player.y >= 330) {
        player.vy = -12;
    }
}

function attack() {
    if (gameOver) return;

    player.attacking = true;
    attackTimer = 15;

    if (Math.abs(player.x - opponent.x) < 100) {
        opponent.health -= 10;

        if (opponent.health <= 0) {
            opponent.health = 0;
            gameOver = true;
            message = "YOU WIN!";
        }
    }
}

function restart() {
    player.x = 180;
    player.y = 330;
    player.vy = 0;
    player.health = 100;
    player.attacking = false;

    opponent.x = 650;
    opponent.health = 100;

    gameOver = false;
    message = "SHADOW ARENA";
}

function update() {
    if (!gameOver) {
        player.y += player.vy;
        player.vy += 0.6;

        if (player.y > 330) {
            player.y = 330;
            player.vy = 0;
        }

        if (attackTimer > 0) {
            attackTimer--;
        } else {
            player.attacking = false;
        }

        // Opponent movement
        if (opponent.x > player.x + 70) {
            opponent.x -= 1;
        }

        // Opponent action
        if (Math.abs(opponent.x - player.x) < 70) {
            opponent.health -= 0.03;
        }
    }

    draw();
}

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "a" || e.key === "ArrowLeft") move(-1);
    if (e.key.toLowerCase() === "d" || e.key === "ArrowRight") move(1);
    if (e.key.toLowerCase() === "w" || e.key === "ArrowUp") jump();
    if (e.key.toLowerCase() === "j") attack();
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

setInterval(update, 30);

draw();
</script>

</body>
</html>
